<!DOCTYPE html>
<html lang="zh-hans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/public/images/logo.jpg" sizes="32x32">
    <link rel="stylesheet" href="/version4/style/publicStyle.css">
    <title>404 - 竹芒雨蹊</title>
    <style>
        :root {
            user-select: none;
            cursor: url(../../public/cursor/normal.cur), default;

        }

        body {
            padding: 0;
            margin: 0;
            /* background-color:blanchedalmond; */
        }

        .bg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: url(/version4/images/background.png);
            background-size: cover;
            background-repeat: no-repeat;
            z-index: -999;
        }

        .head {
            position: fixed;
            top: 0;
            width: 100%;
            height: 5rem;
            background-color: var(--color-stdHead);
            color: var(--color-basic);
        }

        .head-name {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 2rem;
            line-height: 5rem;
            margin-left: 2rem;
            font-family: 'siyuan';
        }

        .head-back {
            position: absolute;
            top: 0;
            right: 0;
            text-decoration: none;
            color: var(--color-basic);
            font-size: 2rem;
            line-height: 5rem;
            margin-right: 2rem;
            font-family: 'pingfang';
            transition: .3s;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .head-back:hover {
            background-color: var(--color-stdHead_hover);
        }

        .msg {
            font-family: 'siyuan';
            text-overflow: clip;
            padding-left: 20vw;
            padding-right: 20vw;
            /* line-height: 4rem; */
            /* font-size: 200%; */
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <div class="bg"></div>
    <div class="head">
        <div class="head-name">竹芒雨蹊 | <span style="font-family: 'pingfang';">错误</span></div>
        <a href="/version4/index.html" class="head-back">返回主页</a>
    </div>
    <div class="placeholder" style="height: 5rem;"> </div>
    <div class="msg">
        <h1 style="font-family: 'Din';"><br><span style="font-family: 'pingfang';">: (</span> <br><br>404 Not Found</h1>
        <h1 style="font-family: 'pingfang';">页面已丢失</h1>
    </div>
</body>

<script>
    const root = document.querySelector(':root');
    if (localStorage.scheme == 1) {
        document.querySelector(".bg").style.background = 'url(/version4/images/bg_night.jpg)';
        root.style.setProperty('--color-stdHead', 'rgba(69, 99, 164, .5)');
        root.style.setProperty('--color-stdHead_hover', 'rgba(69, 99, 164, .8)');
        root.style.setProperty('--color-basic', 'rgba(220, 220, 220, .95)');
    }
</script>

</html>
