<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.0, minimum-scale=1.0">
    <title>终端 - lyx的个人网站</title>
    <link rel="icon" href="/public/images/logo.jpg" sizes="32x32">
    <style>
        /* 全局重置，完全模仿纯Linux终端风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'consolas';
            src: url('/public/fonts/consolas.ttf');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'siyuan';
            src: url('/public/fonts/SourceHanSerifCN-Regular-1-subset.woff2');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow-y: hidden;
            overflow-x: hidden;
            background-color: #0a0a0a;
            font-family: 'consolas', 'siyuan', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Courier New', 'Source Code Pro', monospace;
            font-size: 16px;
            line-height: 1.5;
            color: #c0c0c0;
            cursor: url(/public/cursor/normal.cur), default;
        }

        input {
            cursor: url(/public/cursor/text.cur), default;
        }

        /* 全屏终端容器：无边框，完全铺满 */
        .terminal {
            width: 100vw;
            /* height: 100vh; */
            background-color: #0a0a0a;
            /* display: flex; */
            /* flex-direction: column; */
            padding: 0;
            margin: 0;
            position: relative;
        }

        /* 输出区域：占据几乎所有空间，可滚动，看起来像纯文本终端 */
        .output-area {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 18px 22px 8px 22px;
            background-color: #0a0a0a;
            white-space: pre-wrap;
            word-break: break-word;
            text-rendering: optimizeSpeed;
        }

        /* 输入行区域：固定在底部，像真正的终端提示符 */
        .input-line {
            background-color: #0a0a0a;
            padding: 10px 22px 14px 22px;
            /* border-top: 1px solid #2a2a2a; */
        }

        .prompt {
            color: #8ab4f8;
            user-select: none;
            white-space: nowrap;
            margin-right: 6px;
            font-weight: normal;
        }

        #commandInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e0e0e0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            caret-color: #c0c0c0;
            padding: 0;
            margin: 0;
            resize: none;
            white-space: nowrap;
            overflow: hidden;
            width: calc(100vw - 44px - 13em - 6px)
        }

        #commandInput::placeholder {
            color: #4a4a4a;
        }

        /* 终端内部文字风格：尽量减少彩色，使用基础颜色 */
        .output-line {
            color: #c0c0c0;
            margin: 0;
            padding: 0;
            line-height: 1.45;
        }

        /* 仅用于命令回显或轻微强调，不使用花哨颜色 */
        .cmd-echo {
            color: #b0b0b0;
            /* color: green; */
        }

        .highlight {
            color: #d0d0d0;
            font-weight: normal;
        }

        .dim {
            color: #8a8a8a;
        }

        /* 链接样式保持黑白灰风格 */
        a {
            color: #8ab4f8;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        a:hover {
            color: #b0caf0;
        }

        .green {
            color: green;
        }

        /* 代码雨画布 - 全屏覆盖在终端上方 */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            /* 让点击穿透到终端 */
            background: transparent;
        }

        /* 代码雨出现时，终端输入框仍可交互 */
        .terminal.matrix-active #commandInput {
            position: relative;
            z-index: 101;
        }

        .terminal.matrix-active .input-line {
            position: relative;
            z-index: 101;
        }

        .terminal.matrix-active .output-area {
            position: relative;
            z-index: 101;
        }

        @keyframes clearCodeRain {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="terminal">
        <div class="coderain">
            <canvas id="matrixCanvas" style="display:none;"></canvas>
        </div>
        <div class="output-area" id="outputContainer" role="log" aria-live="polite">
            <!-- 动态输出内容会显示在这里，初始欢迎信息 -->
        </div>
        <div class="input-line">
            <span class="prompt" id="promptSymbol">guest@world:~$ </span>
            <input type="text" id="commandInput" placeholder="输入命令..." autofocus autocomplete="off" spellcheck="false"
                aria-label="终端命令输入">
        </div>
    </div>

    <script>
        (function () {
            // --- 终端状态 ---
            const outputEl = document.getElementById('outputContainer');
            const inputEl = document.getElementById('commandInput');
            const promptEl = document.getElementById('promptSymbol');

            // 当前用户名和主机名 (可随whoami等变化，但保持Linux风格)
            let currentUser = 'user';
            let currentHost = 'world';

            // 历史命令简单存储 (仅用于界面的连续感)
            const commandHistory = [];
            let historyIndex = -1;

            // 用户信息 (用于whoami, about等)
            const userProfile = {
                name: 'LYX / Striumve', // 示例名字，可自行修改
                role: '人',
                location: '中国',
            };

            // 项目列表
            const projectsList = [{
                    name: '竹芒云蹊',
                    desc: '个人空间',
                    url: '/v4/'
                },
                {
                    name: '终端',
                    desc: '仿Linux终端',
                    url: ''
                },
                {
                    name: '光影集',
                    desc: '个人摄影展示',
                    url: '/gallery/'
                },
                {
                    name: '二次元',
                    desc: '二次元属性展示（未完成）',
                    url: '/otaku/'
                },
            ];

            // 联系方式
            const contactInfo = {
                email: '1041095264@qq.com',
                github: 'github.com/striumve',
                qq: '1041095264',
                wechat: '_zzmxqsm_sp_ysyyrps',
            };

            // 秘密菜单 (secret 命令展示)
            const secretMenu = [
                '🍃 竹芒云蹊 · 幽径',
                '---------------------',
                '1. 林中漫步',
                '2. 云栖笔记',
                '3. 月下听泉',
                '4. 松风煮茗',
                '5. 返回现实',
                '(输入对应数字或继续探索)',
            ];

            const now = new Date();

            // --- 工具函数：将文本添加到终端输出区 ---
            function appendOutput(text, className = 'output-line') {
                const div = document.createElement('div');
                div.className = className;
                div.innerHTML = text;
                outputEl.appendChild(div);
            }

            // 支持多行文本一次性添加（保持换行）
            function appendMultiline(text, className = 'output-line') {
                if (!text) return;
                const lines = text.split('\n');
                lines.forEach(line => {
                    appendOutput(line, className);
                });
            }

            // 添加原始HTML（用于链接等，但尽量少用）
            function appendHTML(htmlString) {
                const div = document.createElement('div');
                div.className = 'output-line';
                div.innerHTML = htmlString;
                outputEl.appendChild(div);
            }

            // 清空屏幕
            function clearScreen() {
                outputEl.innerHTML = '';
            }

            // 滚动到底部
            function scrollToBottom() {
                // window.scrollTo(0, document.body.scrollHeight);
                document.querySelector('.terminal').scrollIntoView({
                    behavior: 'smooth',
                    block: 'end' // 让元素的底部对齐到可视区域的底部
                });
            }

            // 更新提示符
            function updatePrompt() {
                promptEl.textContent = `${currentUser}@${currentHost}:~$ `;
            }

            // 显示当前命令回显 (类似你输入命令后终端显示的样子)
            function echoCommand(cmd) {
                appendOutput(`<span class="green">${currentUser}@${currentHost}:~$ </span> ${cmd}`, 'cmd-echo');
            }

            // --- 命令实现 ---

            function cmdAbout() {
                appendMultiline(
                    `关于我\n------\n${userProfile.name}\n${userProfile.role}\n坐标：${userProfile.location}\n没了。`
                );
            }

            function cmdWhoami() {
                appendOutput(currentUser);
            }

            function cmdProjects() {
                appendOutput('项目列表:');
                projectsList.forEach((proj, index) => {
                    // 使用纯文本格式，但为链接提供可点击方式：显示为文本+url。为保持风格，输出可点击链接。
                    const linkHtml =
                        `${index+1}. ${proj.name} - ${proj.desc}  <a href="${proj.url}" target="_blank" rel="noopener">${proj.url}</a>`;
                    appendHTML(linkHtml);
                });
            }

            function cmdNeofetch() {
                // 模拟neofetch风格，显示系统信息与技术栈
                const osInfo = [
                    `OS: StriumveOS 99`,
                    `Host: Virtual Machine`,
                    `Kernel: ${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()}-amd64`,
                    `Shell: bash 5.2.15`,
                    `Resolution: 7680 x 4320`,
                    `CPU: Intel(R) Core(TM) i9-14900K`,
                    `GPU: NVIDIA GeForce GTX 5090`,
                    `Memory: 32045MiB / 64343MiB`,
                ];
                appendOutput(`${currentUser}@${currentHost}`);
                appendOutput('------------');
                osInfo.forEach(line => appendOutput(line));
                appendOutput('');
            }

            function cmdContact() {
                appendOutput('联系方式:');
                appendOutput(`Email: ${contactInfo.email}`);
                appendOutput(`GitHub: ${contactInfo.github}`);
                appendOutput(`QQ: ${contactInfo.qq}`);
                appendOutput(`微信: ${contactInfo.wechat}`);
                appendOutput('欢迎通过交流。');
            }

            function cmdBamboo() {
                appendOutput('正在前往竹芒云蹊...');
                appendOutput('<a href="/v4/" target="_blank" rel="noopener">竹芒云蹊</a>)');
                appendOutput('提示：如果浏览器未打开，请点击上方链接。');
                window.location = '/v4/';
            }

            function cmdDate() {

                // 使用Linux风格日期格式: 星期 月 日 时:分:秒 时区 年
                const dateStr = now.toString(); // 类似于 "Fri May 01 2026 14:30:00 GMT+0800 (中国标准时间)"
                appendOutput(dateStr);
            }

            function cmdCowsay(message) {
                const text = message || '哞~ 欢迎来到我的终端世界。';
                const lineLen = text.length;
                const border = '-'.repeat(lineLen + 2);
                const cow = `
       ${border}
      < ${text} >
       ${border}
              \\   ^__^
               \\  (oo)\\_______
                  (__)\\       )\\/\\
                      ||----w |
                      ||     ||
      `;
                appendOutput(cow);
            }

            function cmdHelp() {
                const helpText = `
可用命令列表:
  about       关于我
  whoami      显示当前用户身份
  projects    项目列表
  neofetch    系统信息
  contact     联系方式
  date        显示当前时间
  cowsay      让牛说句话
  top         显示系统资源
  cat         跳转至路径或文件
  clear/cls   清空屏幕
  exit        结束会话，-w返回欢迎页
  help        显示帮助信息
  ???         ???

提示: 使用 ↑↓ 箭头键浏览历史命令。
      `;
                appendOutput(helpText.trim());
            }

            function cmdSecret() {
                appendOutput('？');
                // secretMenu.forEach(line => appendOutput(line));
            }

            function cmdClear() {
                clearScreen();
            }

            function cmdExit(param) {
                appendOutput('会话结束。即将退出终端');
                setTimeout(() => {
                    if (document.referrer && param != '-w') {
                        window.location = document.referrer;
                    } else {
                        window.location = '/';
                    }
                }, 1000);
            }

            function cmdSudo(cmd) {
                if (cmd == 'rm -rf' || cmd == 'rm -rf /' || cmd == 'rm') {
                    appendOutput('你要对我做什么啊啊啊');
                } else {
                    appendOutput('sudo: 需要密码。');
                }
            }

            let is_coderained = 0; // 一次会话中只能触发一次 code rain

            function cmdCode() {

                // --- 代码雨实现 ---
                let matrixInterval = null;
                let matrixAnimationId = null;
                const matrixCanvas = document.getElementById('matrixCanvas');
                const codeRainDiv = document.querySelector('.coderain');
                const matrixCtx = matrixCanvas.getContext('2d');

                function initMatrixCanvas() {
                    matrixCanvas.width = window.innerWidth;
                    matrixCanvas.height = window.innerHeight;
                    codeRainDiv.style.display = 'block';
                    codeRainDiv.style.opacity = '1';
                }

                function startMatrixRain() {
                    initMatrixCanvas();
                    matrixCanvas.style.display = 'block';

                    // 字符集：片假名 + 数字 + 字母，经典Matrix风格
                    const chars =
                        'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+-=`~<>?":|{}[];.';
                    const fontSize = 14;
                    const columns = Math.floor(matrixCanvas.width / fontSize);

                    // 每列的垂直位置
                    const drops = [];
                    for (let i = 0; i < columns; i++) {
                        drops[i] = Math.floor(Math.random() * -matrixCanvas.height / fontSize);
                    }

                    function draw() {
                        // 半透明背景，形成拖尾效果
                        matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                        matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

                        matrixCtx.fillStyle = '#0F0'; // 经典绿色
                        matrixCtx.font = fontSize + 'px consolas';

                        for (let i = 0; i < drops.length; i++) {
                            // 随机字符
                            const char = chars[Math.floor(Math.random() * chars.length)];
                            const x = i * fontSize;
                            const y = drops[i] * fontSize;

                            // 首字符稍亮
                            if (drops[i] * fontSize < matrixCanvas.height && drops[i] >= 0) {
                                matrixCtx.fillStyle = '#DFD';
                                matrixCtx.fillText(char, x, y);
                                // matrixCtx.fillStyle = '#0F0';
                            } else {
                                matrixCtx.fillText(char, x, y);
                            }

                            // 重置到顶部或继续下落
                            if (y > matrixCanvas.height && Math.random() > 0.975) {
                                drops[i] = 0;
                            }
                            drops[i]++;
                        }

                        matrixAnimationId = requestAnimationFrame(draw);
                    }

                    draw();

                    matrixInterval = setTimeout(() => {
                        stopMatrixRain();
                    }, 7000);
                }

                function stopMatrixRain() {
                    codeRainDiv.style.animation = 'clearCodeRain 1.5s linear both';
                    let clear = setTimeout(() => {
                        codeRainDiv.style.display = 'none';
                        if (matrixAnimationId) {
                            cancelAnimationFrame(matrixAnimationId);
                            matrixAnimationId = null;
                        }
                        if (matrixInterval) {
                            clearTimeout(matrixInterval);
                            matrixInterval = null;
                        }
                        matrixCtx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                    }, 1500);
                    // 清空画布
                }
                if (!is_coderained) {
                    appendOutput('Hello World...');
                    appendOutput('');
                    let start = setTimeout(() => {
                        startMatrixRain();
                        is_coderained = 1;
                        clearTimeout(start);
                    }, 1000);
                } else {
                    appendOutput('The rain has stopped.');
                }
            }

            function cmdTop() {
                const output = `top - ${now.getHours()}:${now.getMinutes()}:${now.getSeconds()} up 187 days,  load average: 0.08, 0.03, 0.01
Tasks:  42 total,   3 running,  39 sleeping,   0 stopped,   0 zombie

  PID USER      PR  NI   VIRT   RES   SHR S  %CPU  %MEM     TIME+   
 1145 Striumve  20   0   2.5g  500m   25m S   8.3  12.5   1:23.45 思考
 2026 YOU       20   0   1.8g  300m   20m S   5.2   7.8   0:45.32 看这个终端
 3456 Striumve  20   0   1.2g  200m   15m S   2.1   4.2   0:12.67 睡觉
 4567 Striumve  20   0   800m  100m   10m S   0.5   1.8   0:05.89 呼吸`;

                appendOutput(output);
            }

            function cmdCat(path) {
                if (path) {
                    window.location = path;
                }
            }

            // 处理未知命令
            function cmdNotFound(cmd) {
                appendOutput(`bash: ${cmd}: 命令未找到`);
            }

            // --- 解析并执行命令 ---
            function executeCommand(inputText) {
                const trimmed = inputText.trim();
                if (trimmed === '') {
                    // 空行直接换行，不输出额外内容
                    return;
                }

                // 回显命令行
                echoCommand(trimmed);

                // 分离命令和参数 (支持 cowsay 后面带文字)
                const parts = trimmed.split(/\s+/);
                const command = parts[0].toLowerCase();
                const args = parts.slice(1).join(' ');

                switch (command) {
                    case 'about':
                        cmdAbout();
                        break;
                    case 'whoami':
                        cmdWhoami();
                        break;
                    case 'projects':
                        cmdProjects();
                        break;
                    case 'neofetch':
                        cmdNeofetch();
                        break;
                    case 'contact':
                        cmdContact();
                        break;
                    case 'date':
                        cmdDate();
                        break;
                    case 'cowsay':
                        cmdCowsay(args || null);
                        break;
                    case 'clear':
                        cmdClear();
                        break;
                    case 'cls':
                        cmdClear();
                        break;
                    case 'exit':
                        cmdExit(args || null);
                        break;
                    case 'secret':
                        cmdSecret();
                        break;
                    case 'help':
                        cmdHelp();
                        break;
                    case 'sudo':
                        cmdSudo(args || null);
                        break;
                    case 'code':
                        cmdCode();
                        break;
                    case 'top':
                        cmdTop();
                        break;
                    case 'cat':
                        cmdCat(args || null);
                        break;
                    default:
                        cmdNotFound(command);
                }

                // 每个命令后添加一个空行，保持清晰
                appendOutput('');
                scrollToBottom();
            }

            // --- 初始化欢迎界面 ---
            function showWelcome() {
                // 清空可能已有的内容
                clearScreen();
                appendOutput('Striumve Terminal (version 1.1.0)');
                appendOutput('输入 help 查看可用命令。');
                appendOutput('');
                scrollToBottom();
            }

            // --- 事件监听 ---
            inputEl.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    const cmd = inputEl.value;
                    // 如果输入被禁用(exit后)，阻止执行
                    if (inputEl.disabled) {
                        e.preventDefault();
                        return;
                    }

                    // 保存到历史记录 (排除空命令)
                    if (cmd.trim() !== '') {
                        commandHistory.push(cmd);
                        historyIndex = commandHistory.length; // 重置索引
                    }

                    executeCommand(cmd);
                    inputEl.value = '';
                    e.preventDefault();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (commandHistory.length === 0) return;
                    if (historyIndex === -1 || historyIndex >= commandHistory.length) {
                        historyIndex = commandHistory.length - 1;
                    } else if (historyIndex > 0) {
                        historyIndex--;
                    }
                    inputEl.value = commandHistory[historyIndex] || '';
                    // 移动光标到末尾
                    inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (commandHistory.length === 0) return;
                    if (historyIndex < commandHistory.length - 1) {
                        historyIndex++;
                        inputEl.value = commandHistory[historyIndex] || '';
                    } else {
                        historyIndex = commandHistory.length;
                        inputEl.value = '';
                    }
                    inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
                }
                // 可选：ctrl+L 清屏
                else if (e.key === 'l' && e.ctrlKey) {
                    e.preventDefault();
                    cmdClear();
                    appendOutput('');
                    scrollToBottom();
                }
            });

            // 点击终端任意位置聚焦输入框 (但避免在选中链接时干扰)
            document.querySelector('body').addEventListener('click', function (e) {
                // 如果点击的是输入框本身或者链接，不强制聚焦（链接需要可点击）
                if (e.target.tagName === 'A' || e.target === inputEl) {
                    return;
                }
                inputEl.focus();
            });

            // 页面加载完成
            window.addEventListener('load', function () {
                updatePrompt();
                showWelcome();
                inputEl.focus();
            });

            // 保证在移动端或触摸时也能正确聚焦
            inputEl.addEventListener('blur', function () {
                // 短暂延迟后重新聚焦，但为了避免过于激进，仅在点击终端背景时处理。
                // 这里不做自动夺焦，以免干扰用户操作。
            });

        })();
    </script>
</body>

</html>
