<!DOCTYPE html>
<html lang="zh-hans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎 - lyx的个人网站</title>
    <link rel="icon" href="/public/images/logo.jpg" sizes="32x32">
    <meta name="description" itemprop="description" content="欢迎分享">
    <meta itemprop="name" content="lyx的个人网站">
    <meta itemprop="image" content="/public/images/logo.jpg">
    <meta name="description" content="竹芒云蹊">
    <meta property="og:title" content="竹芒云蹊">
    <meta property="og:description" content="lyx的个人网站">
    <meta property="og:image" content="/public/images/logo.jpg">
    <style>
        @font-face {
            font-family: 'Din';
            src: url('/public/fonts/DIN-Regular-2.otf');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'siyuanhei';
            src: url('/public/fonts/SourceHanSansSC-Medium-2.otf');
            font-weight: medium;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'siyuanhei';
            src: url('/public/fonts/SourceHanSansSC-Regular-2.otf');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'siyuan';
            src: url('/public/fonts/SourceHanSerifCN-Regular-1-subset.woff2');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'consolas';
            src: url('/public/fonts/consolas.ttf');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @keyframes link-in {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        html {
            cursor: url(/public/cursor/normal.cur), default;
        }

        a {
            cursor: url(/public/cursor/link.cur), default;
        }

        :root {
            --title-fs: 80px;
            --title-top: 60px;
            --link-h: 50px
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background-color: rgb(10, 20, 45);
            user-select: none;
            /* transition: .3s; */
        }

        .title {
            font-family: 'Din';
            font-size: var(--title-fs);
            position: absolute;
            left: clamp(20px, 18vw, 500px);
            top: var(--title-top);
            color: rgb(220, 220, 255);
        }

        .subtitle {
            font-family: 'consolas';
            font-size: calc(var(--title-fs) * 0.45);
            position: absolute;
            left: clamp(20px, 18vw, 500px);
            top: calc(var(--title-top) + var(--title-fs) * 1.4);
            color: rgba(200, 200, 235, .6);
        }
        
		.link {
			display: block;
			width: 350px;
			height: var(--link-h);
            font-family: 'siyuan';
			border-radius: 10px;
			position: relative;
			margin-top: 40px;
			text-decoration: none;
			color: rgba(200, 225, 250, .9);
			font-size: 23px;
			line-height: var(--link-h);
			/* padding-left: 50px; */
			transition: .2s;
			/* opacity: 0; */
		}

        .container :nth-child(1) {
            animation: 'link-in' .8s ease both;
            animation-delay: 0ms;
        }

        .container :nth-child(2) {
            animation: 'link-in' .8s ease both;
            animation-delay: 400ms;
        }

        .container :nth-child(3) {
            animation: 'link-in' .8s ease both;
            animation-delay: 800ms;
        }

        .container :nth-child(4) {
            animation: 'link-in' .8s ease both;
            animation-delay: 1200ms;
        }

        .container {
            position: absolute;
            left: clamp(20px, 18vw, 500px);
            top: calc(var(--title-top) + var(--title-fs) * 2.4);
        }
    </style>
</head>

<script>
</script>

<body>
    <div class="title" style="z-index: 0;">Striumve</div>
    <div class="subtitle">Strive. Triumph.</div>
    <div class="container">
        <a href="/v4/" class="link" data-i="0">&ensp;-&emsp;竹芒云蹊</a>
        <a href="https://github.com/striumve/lyxWebsite" class="link" target="_blank" data-i="1">&ensp;-&emsp;GitHub</a>
        <a href="/v2/" class="link" data-i="2">&ensp;-&emsp;历史版本</a>
        <a href="/terminal/" class="link" data-i="3">&ensp;-&emsp;终端</a>
    </div>
    <div class="btn">更多</div>
    <div class="more">
        <a href=""></a>
    </div>
</body>

<script>
</script>

</html>
