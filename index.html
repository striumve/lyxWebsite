<script>
    function createShootingStar() {
        let vw = document.documentElement.clientWidth;
        let vh = document.documentElement.clientHeight;
        const star = document.createElement('div');
        star.classList.add('shooting-star');
        document.body.appendChild(star);

        let startX, endX;

        if (window.matchMedia('(max-width: 768px)').matches) {
            startX = vw + Math.random() * vw;
            endX = 0 - Math.random() * vw / 2;
        } else {
            startX = vw / 2 + Math.random() * vw / 2;
            endX = Math.random() * vw / 2;
        }

        let distance = Math.sqrt(vh ** 2 + (startX - endX) ** 2);
        let time = distance;

        const animation = star.animate([{
                opacity: 1,
                transform: `translateX(${startX}px)`,
                top: '0px'
            },
            {
                opacity: 1,
                transform: `translateX(${endX}px)`,
                top: '100vh'
            }
        ], {
            duration: time,
            easing: 'linear',
            fill: 'forwards'
        });

        animation.onfinish = () => {
            star.remove();
        };
    }

    function scheduleNext() {
        const delay = 2000 + Math.random() * 8000;
        setTimeout(() => {
            createShootingStar();
            scheduleNext();
        }, delay);
    }

    scheduleNext();
</script>

<script>
    // subtitle animation
    let words = ['S', 't', 'r', 'i', 'v', 'e', '.', ' ', ' ', 'T', 'r', 'i', 'u', 'm', 'p', 'h', '.'];
    let subtitle = document.querySelector('.subtitle');
    subtitle.innerHTML = '';

    function getDelay(char) {
        if (char === ' ') return 150;
        if (char === '.') return 80;
        return 50;
    }

    let i = 0;

    function typeNext() {
        if (i < words.length) {
            subtitle.append(words[i]);
            let delay = getDelay(words[i]);
            i++;
            setTimeout(typeNext, delay);
        }
    }

    typeNext();

    // show more links

    let moreBtn = document.querySelector('.link-more');
    let returnBtn = document.querySelector('.more-back');
    let container = document.querySelector('.container');
    let morePage = document.querySelector('.more');

    moreBtn.addEventListener('click', () => {
        document.querySelector(':root').style.setProperty('--link-ani-delay', '500ms');
        let containerAnimation = container.animate([{
                opacity: 1,
                transform: `translateX(0px)`
            },
            {
                opacity: 0,
                transform: `translateX(-20px)`
            }
        ], {
            duration: 500,
            easing: 'ease',
            fill: 'forwards'
        });

        morePage.style.display = 'block';

        containerAnimation.onfinish = () => {
            let morePageAnimation = morePage.animate([{
                opacity: 0,
                transform: 'translateX(20px)'
            }, {
                opacity: 1,
                transform: 'translateX(0)'
            }], {
                duration: 500,
                easing: 'ease',
                fill: 'forwards'
            });
            container.style.display = 'none';
        };
    })

    returnBtn.addEventListener('click', () => {
        let morePageAnimation = morePage.animate([{
                opacity: 1,
                transform: `translateX(0px)`
            },
            {
                opacity: 0,
                transform: `translateX(20px)`
            }
        ], {
            duration: 500,
            easing: 'ease',
            fill: 'forwards'
        });

        container.style.display = 'block';

        morePageAnimation.onfinish = () => {
            let containerAnimation = container.animate([{
                opacity: 0,
                transform: 'translateX(-20px)'
            }, {
                opacity: 1,
                transform: 'translateX(0)'
            }], {
                duration: 0,
                easing: 'ease',
                fill: 'forwards'
            });
            morePage.style.display = 'none';
        };
    })
</script>
