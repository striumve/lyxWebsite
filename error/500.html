<!DOCTYPE html>
<html lang="zh-hans">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/public/images/logo.jpg" sizes="32x32">
    <link rel="stylesheet" href="/v4/style/publicStyle.css">
    <title>500 - 竹芒云蹊</title>
    <style>
        :root {
            user-select: none;
            cursor: url(../../public/cursor/normal.cur), default;
            --head-height: 50px;
        }

        body {
            padding: 0;
            margin: 0;
            /* background-color:blanchedalmond; */
        }

        .bg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: url(/v4/images/background.png);
            background-size: cover;
            background-repeat: no-repeat;
            z-index: -999;
        }

        .head {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--head-height);
            background-color: var(--color-stdHead);
            color: var(--color-basic);
            backdrop-filter: blur(10px);
        }

        .head-name {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 20px;
            line-height: var(--head-height);
            margin-left: 20px;
            font-family: 'siyuan';
        }

        .head-back {
            position: absolute;
            top: 0;
            right: 0;
            text-decoration: none;
            color: var(--color-basic);
            font-size: 20px;
            line-height: var(--head-height);
            margin-right: 20px;
            font-family: 'pingfang';
            transition: .3s;
            padding-left: 20px;
            padding-right: 20px;
        }

        .head-back:hover {
            background-color: var(--color-stdHead_hover);
        }

        .msg {
            font-family: 'siyuan';
            text-overflow: clip;
            padding-left: 20vw;
            padding-right: 20vw;
            /* line-height: 4rem; */
            /* font-size: 200%; */
            font-size: 20px;
        }

        @media (max-width: 768px) {
            :root {
                --head-height: 40px;
            }
        }
    </style>

    <script>
        const root = document.querySelector(':root');
        if (localStorage.scheme == 1) {
            root.style.setProperty('--bg', 'url(/v4/images/bg_night.png)');
            root.style.setProperty('--cover', 'cover');
            root.style.setProperty('--no-repeat', 'no-repeat');
            root.style.setProperty('--color-stdHead', 'rgba(69, 99, 164, .5)');
            root.style.setProperty('--color-stdHead_hover', 'rgba(69, 99, 164, .8)');
            root.style.setProperty('--color-basic', 'rgba(220, 220, 220, .95)');
        }
    </script>
</head>

<body>
    <div class="bg"></div>
    <div class="head">
        <div class="head-name">竹芒云蹊 | <span style="font-family: 'pingfang';">错误</span></div>
        <a href="/v4/index.html" class="head-back">返回主页</a>
    </div>
    <div class="placeholder" style="height: var(--head-height);"> </div>
    <div class="msg">
        <h1 style="font-family: 'Din';"><br><span style="font-family: 'pingfang';">: (</span> <br><br>500 Internal Server Error</h1>
        <h1 style="font-family: 'pingfang';">服务器错误</h1>
    </div>
</body>

</html>
