<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影集 | Photography</title>
    <link rel="icon" href="/public/images/logo.jpg" sizes="32x32">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'jetbrains';
            src: url('/public/fonts/JetBrainsMono-Regular-2.ttf');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'siyuan';
            src: url('/public/fonts/SourceHanSerifCN-Regular-1-subset.woff2');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        :root {
            --bg-primary: #0c0c0c;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #999999;
            --text-tertiary: #666666;
            --accent: #c9a96e;
            --accent-hover: #d4b87a;
            --border: #222222;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: url(/public/cursor/normal.cur), default;
            user-select: none;
        }

        /* 返回按钮 */
        .back-nav {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.5s var(--transition);
            /* opacity: 0; */
            /* animation: fadeIn 1s ease 0.5s forwards; */
            cursor: url(/public/cursor/link.cur), default;
        }

        .back-nav::before {
            content: '';
            width: 32px;
            height: 1px;
            background: var(--text-secondary);
            transition: all 0.5s var(--transition);
        }

        .back-nav:hover {
            color: var(--text-primary);
            transform: translateX(-8px);
        }

        .back-nav:hover::before {
            width: 48px;
            background: var(--accent);
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transform: translateY(-100%);
            transition: transform 0.5s var(--transition), opacity 0.5s var(--transition);
            opacity: 0;
        }

        .top-bar.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .top-bar-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar-back {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
            padding-left: 20px;
        }

        .top-bar-back::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 1px;
            background: currentColor;
            transition: width 0.3s;
        }

        .top-bar-back:hover {
            color: var(--text-primary);
        }

        .top-bar-back:hover::before {
            width: 16px;
        }

        .top-bar-title {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--text-primary);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'siyuan';
        }

        .top-bar-spacer {
            width: 60px;
        }

        .top-bar-info {
            font-family: system-ui;
            font-size: 15px;
        }

        /* 头部区域 */
        .hero {
            min-height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 20px 80px;
            position: relative;
            font-family: 'siyuan';
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--accent), transparent);
            opacity: 0.4;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 100;
            letter-spacing: 0.25em;
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 1.2s ease 0.3s forwards;
        }

        .hero .subtitle {
            font-size: clamp(0.8rem, 1.5vw, 0.95rem);
            color: var(--text-secondary);
            letter-spacing: 0.4em;
            font-weight: 300;
            opacity: 0;
            animation: fadeIn 1.2s ease 0.9s forwards;
        }

        .hero .subtitle::before,
        .hero .subtitle::after {
            content: '—';
            margin: 0 20px;
            opacity: 0.3;
        }

        /* 分类筛选 */
        .filter-bar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 13px;
            letter-spacing: 2px;
            padding: 8px 0;
            position: relative;
            transition: color 0.4s;
            font-family: inherit;
            cursor: url(/public/cursor/link.cur), default;
        }

        .filter-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.4s var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: var(--text-primary);
        }

        .filter-btn.active::after,
        .filter-btn:hover::after {
            width: 100%;
        }

        /* 画廊主体 - 瀑布流 */
        .gallery {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 100px;
            columns: 3;
            column-gap: 20px;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            cursor: url(/public/cursor/link.cur), default;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.7s var(--transition), transform 0.9s var(--transition);
            border-radius: 2px;
        }

        .gallery-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item.hidden {
            display: none;
        }

        .gallery-item.invisible {
            opacity: 0;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 1.2s var(--transition), filter 0.7s var(--transition);
            filter: grayscale(10%) brightness(0.95) contrast(1);
        }

        .gallery-item:hover img {
            transform: scale(1.06);
            filter: grayscale(0%) brightness(1) contrast(1);
        }

        .gallery-item .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.2) 40%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 28px;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .gallery-item .photo-title {
            font-size: 1.05rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            transform: translateY(16px);
            transition: transform 0.6s var(--transition);
            line-height: 1.4;
        }

        .gallery-item:hover .photo-title {
            transform: translateY(0);
        }

        .gallery-item .photo-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 10px;
            letter-spacing: 0.08em;
            transform: translateY(16px);
            transition: transform 0.6s var(--transition) 0.08s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gallery-item:hover .photo-meta {
            transform: translateY(0);
        }

        .photo-meta .tag {
            display: inline-block;
            padding: 2px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }

        /* 灯箱 - 左右分栏 */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(8, 8, 8, 0.98);
            z-index: 1000;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s var(--transition);
            backdrop-filter: blur(30px);
            overflow: auto;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-inner {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        .lightbox-image-area {
            flex: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 40px;
            position: relative;
        }

        .lightbox-image-area img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            transform: scale(0.92);
            opacity: 0;
            transition: all 0.7s var(--transition);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
        }

        .lightbox.active .lightbox-image-area img {
            transform: scale(1);
            opacity: 1;
        }

        .lightbox-info-area {
            flex: 0.6;
            min-width: 320px;
            max-width: 420px;
            padding: 80px 50px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid var(--border);
            background: var(--bg-secondary);
            transform: translateX(30px);
            opacity: 0;
            transition: all 0.7s var(--transition) 0.15s;
            overflow-y: auto;
        }

        .lightbox.active .lightbox-info-area {
            transform: translateX(0);
            opacity: 1;
        }

        .lightbox-category {
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .lightbox-title {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            font-weight: 200;
            letter-spacing: 0.05em;
            line-height: 1.3;
            margin-bottom: 24px;
            font-family: 'siyuan';
        }

        .lightbox-divider {
            width: 40px;
            height: 1px;
            background: var(--accent);
            margin-bottom: 28px;
            opacity: 0.6;
        }

        .lightbox-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.9;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .lightbox-details {
            border-top: 1px solid var(--border);
            padding-top: 28px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
            font-size: 0.85rem;
        }

        .detail-label {
            color: var(--text-tertiary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .detail-value {
            color: var(--text-secondary);
            font-weight: 300;
            font-family: 'jetbrains';
        }

        /* 灯箱导航 */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: url(/public/cursor/link.cur), default;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 20px;
            transition: all 0.3s;
            z-index: 10;
            font-family: 'jetbrains';
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            /* right: calc(0.6 * 100% + 20px); */
            right: 20px;
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            cursor: url(/public/cursor/link.cur), default;
            opacity: 0.5;
            transition: opacity 0.3s;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-close::before,
        .lightbox-close::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 1px;
            background: white;
        }

        .lightbox-close::before {
            transform: rotate(45deg);
        }

        .lightbox-close::after {
            transform: rotate(-45deg);
        }

        .lightbox-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-tertiary);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            z-index: 10;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            border-top: 1px solid var(--border);
            margin: 0 auto;
            max-width: 1400px;
        }

        /* 动画 */
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式 - 平板 */
        @media (max-width: 1024px) {
            .gallery {
                columns: 2;
                column-gap: 16px;
                padding: 20px 16px 80px;
            }

            .back-nav {
                top: 24px;
                left: 24px;
            }

            .lightbox-inner {
                flex-direction: column;
            }

            .lightbox-image-area {
                flex: none;
                height: 55vh;
                padding: 60px 20px 20px;
            }

            .lightbox-image-area img {
                max-height: 50vh;
            }

            .lightbox-info-area {
                flex: none;
                max-width: none;
                min-width: auto;
                padding: 30px 40px 40px;
                border-left: none;
                border-top: 1px solid var(--border);
                transform: translateY(20px);
            }

            .lightbox.active .lightbox-info-area {
                transform: translateY(0);
            }

            .lightbox-next {
                right: 20px;
            }

            .lightbox-nav {
                width: 44px;
                height: 44px;
                font-size: 16px;
            }
        }

        /* 响应式 - 手机 */
        @media (max-width: 640px) {
            .gallery {
                columns: 1;
                padding: 10px 16px 60px;
            }

            .hero {
                min-height: 45vh;
                padding: 100px 20px 50px;
            }

            .hero::after {
                height: 40px;
            }

            .hero h1 {
                letter-spacing: 0.15em;
            }

            .hero .subtitle::before,
            .hero .subtitle::after {
                margin: 0 12px;
            }

            .back-nav {
                font-size: 12px;
                top: 20px;
                left: 20px;
                letter-spacing: 2px;
            }

            .top-bar-inner {
                padding: 0 20px;
                height: 52px;
            }

            .top-bar-title {
                font-size: 13px;
                letter-spacing: 0.2em;
            }

            .top-bar-back {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .back-nav::before {
                width: 24px;
            }

            .filter-bar {
                gap: 24px;
                padding-bottom: 30px;
            }

            .filter-btn {
                font-size: 12px;
            }

            .gallery-item .overlay {
                padding: 20px;
                opacity: 1;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.65) 0%, transparent 60%);
            }

            .gallery-item .photo-title,
            .gallery-item .photo-meta {
                transform: translateY(0);
            }

            .lightbox-image-area {
                height: 50vh;
                padding: 50px 16px 16px;
            }

            .lightbox-image-area img {
                max-height: 45vh;
            }

            .lightbox-info-area {
                padding: 24px 24px 30px;
            }

            .lightbox-title {
                font-size: 1.3rem;
                margin-bottom: 16px;
            }

            .lightbox-description {
                font-size: 0.85rem;
                line-height: 1.7;
                margin-bottom: 24px;
            }

            .lightbox-close {
                top: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
            }

            .lightbox-nav {
                display: none;
            }

            .lightbox-counter {
                bottom: 16px;
            }

            .detail-row {
                padding: 8px 0;
                font-size: 0.8rem;
            }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>

<body>
    <header class="top-bar" id="topBar">
        <div class="top-bar-inner">
            <a class="top-bar-back">返回</a>
            <h2 class="top-bar-title">光影集<span class="top-bar-info"></span></h2>
            <div class="top-bar-spacer"></div>
        </div>
    </header>

    <a class="back-nav">返回</a>

    <header class="hero">
        <h1>光影集</h1>
        <p class="subtitle"> moments in light </p>
    </header>

    <nav class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="selected">精选</button>
        <button class="filter-btn" data-filter="landscape">风光</button>
        <button class="filter-btn" data-filter="city">城市</button>
        <button class="filter-btn" data-filter="life">生活</button>
        <button class="filter-btn" data-filter="nature">自然</button>
    </nav>

    <main class="gallery" id="gallery"></main>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-inner">
            <div class="lightbox-image-area">
                <img src="" alt="" id="lightbox-img">
                <div class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)"><</div>
                <div class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">></div>
                <div class="lightbox-close" onclick="closeLightbox()"></div>
                <div class="lightbox-counter" id="lightbox-counter">1 / 10</div>
            </div>
            <div class="lightbox-info-area" id="lightbox-info">
                <div class="lightbox-category" id="lb-category">风光</div>
                <h2 class="lightbox-title" id="lb-title">山巅云海</h2>
                <div class="lightbox-divider"></div>
                <p class="lightbox-description" id="lb-description">
                    凌晨四点开始攀登，在零下五度的寒风中等待了三个小时...
                </p>
                <div class="lightbox-details">
                    <div class="detail-row">
                        <span class="detail-label">拍摄时间</span>
                        <span class="detail-value" id="lb-date">2024.03</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">拍摄地点</span>
                        <span class="detail-value" id="lb-location">黄山</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">相机</span>
                        <span class="detail-value" id="lb-camera">Sony A7R V</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">镜头</span>
                        <span class="detail-value" id="lb-lens">24-70mm GM II</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p> 摄影作品集 · Copyright ©2022-2026 芒蹊 保留所有权利</p>
        <p> 本页面使用Kimi-K2.6辅助制作 </p>
    </footer>

    <script>
        // 把所有的变量定义放到前面，防止出现各种各样的undefined
        var lightbox;
        var lightboxImg;
        var lightboxCounter;
        var currentIndex = 0;
        var visibleItems = [];

        var item;
        var img;

        var filterBtns;
        var galleryItems;

        var currentFilter = 'all';

        const categoryMap = {
            'city': '城市',
            'nature': '自然',
            'life': '生活',
            'landscape': '风光', 
            'selected': '精选'
        };

        async function loadImages() {
            let response = await fetch('/gallery/list.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应失败');
                    }
                    return response.json();
                })
                .then(data => {
                    generateGalleryItems(data);
                })
                .then(() => {
                    initApp();
                })
                .catch(error => {
                    console.error('加载 JSON 文件出错：', error);
                });
        }

        loadImages();

        function updateVisibleItems() {
            visibleItems = Array.from(document.querySelectorAll('.gallery-item:not(.hidden)'));
        }

        function openLightbox(index) {
            updateVisibleItems();
            currentIndex = index;
            item = visibleItems[index];
            img = item.querySelector('img');

            // 填充信息
            lightboxImg.src = img.src.replace('w=800', 'w=1600');
            document.getElementById('lb-category').textContent = getCategoryName(item.dataset
                .category);
            document.getElementById('lb-title').textContent = item.dataset.title;
            document.getElementById('lb-description').textContent = item.dataset.description;
            document.getElementById('lb-date').textContent = item.dataset.date;
            document.getElementById('lb-location').textContent = item.dataset.location;
            document.getElementById('lb-camera').textContent = item.dataset.camera;
            document.getElementById('lb-lens').textContent = item.dataset.lens;
            lightboxCounter.textContent = `${index + 1} / ${visibleItems.length}`;

            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function getCategoryName(cat) {
            const map = {
                landscape: '风光',
                city: '城市',
                life: '生活',
                nature: '自然'
            };
            return map[cat] || cat;
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                lightboxImg.src = '';
            }, 500);
        }

        function navigateLightbox(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = visibleItems.length - 1;
            if (currentIndex >= visibleItems.length) currentIndex = 0;

            // 简单的淡出淡入
            lightboxImg.style.opacity = '0';
            lightboxImg.style.transform = 'scale(0.92)';

            setTimeout(() => {
                openLightbox(currentIndex);
                lightboxImg.style.opacity = '1';
                lightboxImg.style.transform = 'scale(1)';
            }, 300);
        }

        function initApp() {
            // 灯箱
            lightbox = document.getElementById('lightbox');
            lightboxImg = document.getElementById('lightbox-img');
            lightboxCounter = document.getElementById('lightbox-counter');
            // 筛选
            filterBtns = document.querySelectorAll('.filter-btn');
            galleryItems = document.querySelectorAll('.gallery-item');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const filter = btn.dataset.filter;
                    currentFilter = btn.dataset.filter;

                    galleryItems.forEach(item => {
                        item.classList.add('invisible');
                        setTimeout(() => {
                            item.classList.add('hidden');
                            if (filter === 'all' || item.dataset.category === filter ||
                                (filter == 'selected' && item.dataset.selected ==
                                    'true')) {
                                item.classList.remove('hidden');
                                item.classList.remove('invisible');
                                setTimeout(() => item.classList.add('visible'), 50);
                            } else {
                                item.classList.remove('visible');
                                setTimeout(() => item.classList.add('hidden'), 600);
                            }
                        }, 600)
                    });
                });
            });

            // 滚动显示动画
            const observerOptions = {
                threshold: 0.08,
                rootMargin: '0px 0px -60px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            galleryItems.forEach(item => observer.observe(item));

            // 绑定点击事件
            galleryItems.forEach((item, index) => {
                item.addEventListener('click', () => {
                    updateVisibleItems();
                    const visibleIndex = visibleItems.indexOf(item);
                    openLightbox(visibleIndex);
                });
            });

            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            });

            // 点击背景关闭
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox || e.target.classList.contains('lightbox-inner')) {
                    closeLightbox();
                }
            });

            // 触摸滑动支持
            let touchStartX = 0;
            lightbox.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });

            lightbox.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) navigateLightbox(1);
                    else navigateLightbox(-1);
                }
            });

            // 初始化
            updateVisibleItems();
        }

        function generateGalleryItems(photos) {
            const container = document.getElementById('gallery');

            photos.forEach(photo => {
                const galleryItem = document.createElement('div');
                galleryItem.className = 'gallery-item';
                galleryItem.setAttribute('data-category', photo.category);
                galleryItem.setAttribute('data-title', photo.title);
                galleryItem.setAttribute('data-date', photo.date);
                galleryItem.setAttribute('data-location', photo.location);
                galleryItem.setAttribute('data-camera', photo.camera);
                galleryItem.setAttribute('data-lens', photo.lens);
                galleryItem.setAttribute('data-description', photo.description);
                galleryItem.setAttribute('data-selected', photo.selected ? photo.selected : 'false');

                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = '图片加载失败';

                const overlay = document.createElement('div');
                overlay.className = 'overlay';

                const photoTitle = document.createElement('div');
                photoTitle.className = 'photo-title';
                photoTitle.textContent = photo.title;

                const photoMeta = document.createElement('div');
                photoMeta.className = 'photo-meta';

                const dateSpan = document.createElement('span');
                dateSpan.textContent = photo.date;

                const tagSpan = document.createElement('span');
                tagSpan.className = 'tag';
                tagSpan.textContent = categoryMap[photo.category] || photo.category;

                photoMeta.appendChild(dateSpan);
                photoMeta.appendChild(tagSpan);

                overlay.appendChild(photoTitle);
                overlay.appendChild(photoMeta);

                galleryItem.appendChild(img);
                galleryItem.appendChild(overlay);

                container.appendChild(galleryItem);
            });
        }



        document.querySelector('.back-nav').addEventListener('click', () => {
            if (document.referrer && document.referrer != window.location.href) {
                window.location = document.referrer;
            } else {
                window.location = '/';
            }
        })

        document.querySelector('.top-bar-back').addEventListener('click', () => {
            if (document.referrer && document.referrer != window.location.href) {
                window.location = document.referrer;
            } else {
                window.location = '/';
            }
        })

        // 下划时显示topbar
        const topBar = document.getElementById('topBar');
        const topBarInfo = document.querySelector(".top-bar-info");
        const backNav = document.querySelector('.back-nav');
        let lastScrollY = 0;
        const heroHeight = document.querySelector('.hero').offsetHeight;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;

            if (currentScrollY > heroHeight * 0.6) {
                topBar.classList.add('visible');
                backNav.style.opacity = '0';
                backNav.style.pointerEvents = 'none';

                topBarInfo.innerHTML = currentFilter == 'all' ? '' : ` - ${categoryMap[currentFilter]}`
            } else {
                topBar.classList.remove('visible');
                backNav.style.opacity = '';
                backNav.style.pointerEvents = '';
            }

            lastScrollY = currentScrollY;
        });
    </script>

</body>
