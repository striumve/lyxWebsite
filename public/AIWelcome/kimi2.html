<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Complex Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050508;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Courier New', monospace;
            perspective: 1200px;
        }

        /* ========== 背景星空层 ========== */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        }

        /* 生成100颗星星 */
        .star:nth-child(1) { top: 5%; left: 10%; width: 2px; height: 2px; --duration: 3s; --delay: 0s; }
        .star:nth-child(2) { top: 15%; left: 25%; width: 3px; height: 3px; --duration: 4s; --delay: 0.5s; }
        .star:nth-child(3) { top: 8%; left: 45%; width: 2px; height: 2px; --duration: 2.5s; --delay: 1s; }
        .star:nth-child(4) { top: 25%; left: 60%; width: 1px; height: 1px; --duration: 3.5s; --delay: 0.3s; }
        .star:nth-child(5) { top: 12%; left: 80%; width: 2px; height: 2px; --duration: 2s; --delay: 0.8s; }
        .star:nth-child(6) { top: 35%; left: 15%; width: 1px; height: 1px; --duration: 4s; --delay: 1.2s; }
        .star:nth-child(7) { top: 45%; left: 35%; width: 3px; height: 3px; --duration: 3s; --delay: 0.2s; }
        .star:nth-child(8) { top: 30%; left: 55%; width: 2px; height: 2px; --duration: 2.5s; --delay: 1.5s; }
        .star:nth-child(9) { top: 20%; left: 75%; width: 1px; height: 1px; --duration: 3.5s; --delay: 0.6s; }
        .star:nth-child(10) { top: 50%; left: 90%; width: 2px; height: 2px; --duration: 2s; --delay: 1s; }
        .star:nth-child(11) { top: 60%; left: 5%; width: 1px; height: 1px; --duration: 4s; --delay: 0.4s; }
        .star:nth-child(12) { top: 55%; left: 20%; width: 2px; height: 2px; --duration: 3s; --delay: 0.9s; }
        .star:nth-child(13) { top: 70%; left: 40%; width: 3px; height: 3px; --duration: 2.5s; --delay: 0.1s; }
        .star:nth-child(14) { top: 65%; left: 65%; width: 1px; height: 1px; --duration: 3.5s; --delay: 1.3s; }
        .star:nth-child(15) { top: 75%; left: 85%; width: 2px; height: 2px; --duration: 2s; --delay: 0.7s; }
        .star:nth-child(16) { top: 85%; left: 10%; width: 1px; height: 1px; --duration: 4s; --delay: 1.1s; }
        .star:nth-child(17) { top: 80%; left: 30%; width: 2px; height: 2px; --duration: 3s; --delay: 0.3s; }
        .star:nth-child(18) { top: 90%; left: 50%; width: 1px; height: 1px; --duration: 2.5s; --delay: 0.8s; }
        .star:nth-child(19) { top: 88%; left: 70%; width: 3px; height: 3px; --duration: 3.5s; --delay: 1.4s; }
        .star:nth-child(20) { top: 95%; left: 90%; width: 2px; height: 2px; --duration: 2s; --delay: 0.5s; }
        .star:nth-child(21) { top: 3%; left: 5%; width: 1px; height: 1px; --duration: 3s; --delay: 0.2s; }
        .star:nth-child(22) { top: 18%; left: 15%; width: 2px; height: 2px; --duration: 4s; --delay: 1s; }
        .star:nth-child(23) { top: 28%; left: 50%; width: 1px; height: 1px; --duration: 2.5s; --delay: 0.6s; }
        .star:nth-child(24) { top: 38%; left: 70%; width: 2px; height: 2px; --duration: 3s; --delay: 1.2s; }
        .star:nth-child(25) { top: 48%; left: 85%; width: 1px; height: 1px; --duration: 4s; --delay: 0.4s; }
        .star:nth-child(26) { top: 58%; left: 45%; width: 2px; height: 2px; --duration: 2.5s; --delay: 0.9s; }
        .star:nth-child(27) { top: 68%; left: 25%; width: 1px; height: 1px; --duration: 3.5s; --delay: 1.5s; }
        .star:nth-child(28) { top: 78%; left: 60%; width: 2px; height: 2px; --duration: 2s; --delay: 0.1s; }
        .star:nth-child(29) { top: 88%; left: 80%; width: 1px; height: 1px; --duration: 3s; --delay: 0.7s; }
        .star:nth-child(30) { top: 42%; left: 5%; width: 2px; height: 2px; --duration: 4s; --delay: 1.1s; }

        /* ========== 3D 几何体场景 ========== */
        .scene {
            position: fixed;
            top: 50%; left: 50%;
            transform-style: preserve-3d;
            animation: sceneRotate 20s linear infinite;
        }

        @keyframes sceneRotate {
            0% { transform: translate(-50%, -50%) rotateX(15deg) rotateY(0deg); }
            100% { transform: translate(-50%, -50%) rotateX(15deg) rotateY(360deg); }
        }

        /* 轨道环 */
        .orbit {
            position: absolute;
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        .orbit-1 {
            width: 400px; height: 400px;
            animation: orbitTilt1 8s ease-in-out infinite;
        }

        .orbit-2 {
            width: 300px; height: 300px;
            top: 50px; left: 50px;
            border-color: rgba(255, 100, 150, 0.12);
            animation: orbitTilt2 10s ease-in-out infinite;
        }

        .orbit-3 {
            width: 500px; height: 500px;
            top: -50px; left: -50px;
            border-color: rgba(150, 255, 100, 0.1);
            animation: orbitTilt3 12s ease-in-out infinite;
        }

        @keyframes orbitTilt1 {
            0%, 100% { transform: rotateX(75deg) rotateZ(0deg); }
            50% { transform: rotateX(75deg) rotateZ(180deg); }
        }

        @keyframes orbitTilt2 {
            0%, 100% { transform: rotateX(60deg) rotateZ(120deg); }
            50% { transform: rotateX(60deg) rotateZ(300deg); }
        }

        @keyframes orbitTilt3 {
            0%, 100% { transform: rotateX(80deg) rotateZ(240deg); }
            50% { transform: rotateX(80deg) rotateZ(60deg); }
        }

        /* 3D 立方体 */
        .cube {
            position: absolute;
            width: 60px; height: 60px;
            transform-style: preserve-3d;
            animation: cubeFloat 6s ease-in-out infinite;
        }

        .cube-face {
            position: absolute;
            width: 60px; height: 60px;
            border: 1px solid rgba(100, 200, 255, 0.4);
            background: rgba(100, 200, 255, 0.05);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.1) inset;
        }

        .cube-face:nth-child(1) { transform: rotateY(0deg) translateZ(30px); }
        .cube-face:nth-child(2) { transform: rotateY(90deg) translateZ(30px); }
        .cube-face:nth-child(3) { transform: rotateY(180deg) translateZ(30px); }
        .cube-face:nth-child(4) { transform: rotateY(-90deg) translateZ(30px); }
        .cube-face:nth-child(5) { transform: rotateX(90deg) translateZ(30px); }
        .cube-face:nth-child(6) { transform: rotateX(-90deg) translateZ(30px); }

        .cube-1 { top: -30px; left: 170px; animation-delay: 0s; }
        .cube-2 { top: 170px; left: -30px; animation-delay: 1s; }
        .cube-3 { top: 170px; left: 370px; animation-delay: 2s; }
        .cube-4 { top: 370px; left: 170px; animation-delay: 3s; }

        @keyframes cubeFloat {
            0%, 100% { transform: translateZ(0px) rotateX(0deg) rotateY(0deg); }
            25% { transform: translateZ(50px) rotateX(90deg) rotateY(90deg); }
            50% { transform: translateZ(0px) rotateX(180deg) rotateY(180deg); }
            75% { transform: translateZ(-50px) rotateX(270deg) rotateY(270deg); }
        }

        /* 八面体 (双锥) */
        .octahedron {
            position: absolute;
            width: 0; height: 0;
            transform-style: preserve-3d;
            animation: octaSpin 8s linear infinite;
        }

        .octa-face {
            position: absolute;
            width: 0; height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 52px solid rgba(255, 100, 150, 0.15);
            transform-origin: 50% 100%;
        }

        .octa-face:nth-child(1) { transform: rotateY(0deg) rotateX(19.5deg); }
        .octa-face:nth-child(2) { transform: rotateY(90deg) rotateX(19.5deg); }
        .octa-face:nth-child(3) { transform: rotateY(180deg) rotateX(19.5deg); }
        .octa-face:nth-child(4) { transform: rotateY(270deg) rotateX(19.5deg); }
        .octa-face:nth-child(5) { transform: rotateY(0deg) rotateX(-19.5deg) rotateZ(180deg); }
        .octa-face:nth-child(6) { transform: rotateY(90deg) rotateX(-19.5deg) rotateZ(180deg); }
        .octa-face:nth-child(7) { transform: rotateY(180deg) rotateX(-19.5deg) rotateZ(180deg); }
        .octa-face:nth-child(8) { transform: rotateY(270deg) rotateX(-19.5deg) rotateZ(180deg); }

        .octa-1 { top: 150px; left: 150px; animation-delay: 0s; }
        .octa-2 { top: 200px; left: 200px; animation-delay: 2s; animation-direction: reverse; }

        @keyframes octaSpin {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
        }

        /* 金字塔 */
        .pyramid {
            position: absolute;
            width: 0; height: 0;
            transform-style: preserve-3d;
            animation: pyramidRotate 10s linear infinite;
        }

        .pyr-face {
            position: absolute;
            width: 0; height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid rgba(150, 255, 100, 0.12);
            transform-origin: 50% 100%;
        }

        .pyr-face:nth-child(1) { transform: rotateY(0deg) translateZ(25px) rotateX(30deg); }
        .pyr-face:nth-child(2) { transform: rotateY(90deg) translateZ(25px) rotateX(30deg); }
        .pyr-face:nth-child(3) { transform: rotateY(180deg) translateZ(25px) rotateX(30deg); }
        .pyr-face:nth-child(4) { transform: rotateY(270deg) translateZ(25px) rotateX(30deg); }

        .pyr-1 { top: 100px; left: 250px; animation-delay: 1s; }

        @keyframes pyramidRotate {
            0% { transform: rotateY(0deg) translateY(0px); }
            50% { transform: rotateY(180deg) translateY(-30px); }
            100% { transform: rotateY(360deg) translateY(0px); }
        }

        /* ========== 光线扫描效果 ========== */
        .scanner {
            position: fixed;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(100, 200, 255, 0.03) 50%, transparent 100%);
            animation: scan 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        /* ========== 中心文字动画 ========== */
        .center-text {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
        }

        .glitch-text {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            position: relative;
            animation: textReveal 3s ease-out forwards, textFloat 4s ease-in-out infinite 3s;
            opacity: 0;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .glitch-text::before {
            color: #ff0066;
            animation: glitch1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translateX(-2px);
        }

        .glitch-text::after {
            color: #00ffff;
            animation: glitch2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
            transform: translateX(2px);
        }

        @keyframes textReveal {
            0% { opacity: 0; transform: scale(0.5) translateY(50px); letter-spacing: 2em; }
            50% { opacity: 0.5; transform: scale(1.1) translateY(-10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); letter-spacing: 0.5em; }
        }

        @keyframes textFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glitch1 {
            0%, 90%, 100% { transform: translateX(-2px); }
            20% { transform: translateX(5px) skewX(10deg); }
            40% { transform: translateX(-8px); }
            60% { transform: translateX(3px); }
            80% { transform: translateX(-5px) skewX(-5deg); }
        }

        @keyframes glitch2 {
            0%, 90%, 100% { transform: translateX(2px); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(4px) skewX(-8deg); }
            75% { transform: translateX(-3px); }
        }

        /* 副标题 */
        .subtitle {
            margin-top: 2rem;
            font-size: 1rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.3em;
            animation: fadeInUp 2s ease-out 2s forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 底部装饰线 */
        .decoration-line {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100,200,255,0.5), transparent);
            animation: lineExpand 3s ease-out 1s forwards;
            opacity: 0;
        }

        @keyframes lineExpand {
            0% { width: 0; opacity: 0; }
            100% { width: 200px; opacity: 1; }
        }

        /* 粒子拖尾 */
        .particle-trail {
            position: fixed;
            width: 4px; height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }

        .pt-1 { top: 20%; left: 10%; background: rgba(100,200,255,0.8); animation: trail1 5s linear infinite; }
        .pt-2 { top: 60%; left: 80%; background: rgba(255,100,150,0.8); animation: trail2 7s linear infinite; }
        .pt-3 { top: 40%; left: 90%; background: rgba(150,255,100,0.8); animation: trail3 6s linear infinite; }

        @keyframes trail1 {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            25% { transform: translate(100px, -50px) scale(0.5); opacity: 0.5; }
            50% { transform: translate(200px, 0) scale(1); opacity: 1; }
            75% { transform: translate(300px, 50px) scale(0.5); opacity: 0.5; }
            100% { transform: translate(400px, 0) scale(0); opacity: 0; }
        }

        @keyframes trail2 {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            25% { transform: translate(-80px, 80px) scale(0.5); opacity: 0.5; }
            50% { transform: translate(-160px, 0) scale(1); opacity: 1; }
            75% { transform: translate(-240px, -80px) scale(0.5); opacity: 0.5; }
            100% { transform: translate(-320px, 0) scale(0); opacity: 0; }
        }

        @keyframes trail3 {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            33% { transform: translate(-100px, -100px) scale(0.5); opacity: 0.5; }
            66% { transform: translate(-200px, 0) scale(1); opacity: 1; }
            100% { transform: translate(-300px, 100px) scale(0); opacity: 0; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .glitch-text { font-size: 2rem; letter-spacing: 0.3em; }
            .orbit-1 { width: 250px; height: 250px; }
            .orbit-2 { width: 180px; height: 180px; top: 35px; left: 35px; }
            .orbit-3 { width: 320px; height: 320px; top: -35px; left: -35px; }
            .cube { width: 40px; height: 40px; }
            .cube-face { width: 40px; height: 40px; }
            .cube-face:nth-child(1) { transform: rotateY(0deg) translateZ(20px); }
            .cube-face:nth-child(2) { transform: rotateY(90deg) translateZ(20px); }
            .cube-face:nth-child(3) { transform: rotateY(180deg) translateZ(20px); }
            .cube-face:nth-child(4) { transform: rotateY(-90deg) translateZ(20px); }
            .cube-face:nth-child(5) { transform: rotateX(90deg) translateZ(20px); }
            .cube-face:nth-child(6) { transform: rotateX(-90deg) translateZ(20px); }
        }
    </style>
</head>
<body>

    <!-- 星空背景 -->
    <div class="stars">
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
    </div>

    <!-- 光线扫描 -->
    <div class="scanner"></div>

    <!-- 3D 场景 -->
    <div class="scene">
        <!-- 轨道 -->
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>

        <!-- 立方体 -->
        <div class="cube cube-1">
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
        </div>
        <div class="cube cube-2">
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
        </div>
        <div class="cube cube-3">
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
        </div>
        <div class="cube cube-4">
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
            <div class="cube-face"></div><div class="cube-face"></div>
        </div>

        <!-- 八面体 -->
        <div class="octahedron octa-1">
            <div class="octa-face"></div><div class="octa-face"></div>
            <div class="octa-face"></div><div class="octa-face"></div>
            <div class="octa-face"></div><div class="octa-face"></div>
            <div class="octa-face"></div><div class="octa-face"></div>
        </div>
        <div class="octahedron octa-2">
            <div class="octa-face"></div><div class="octa-face"></div>
            <div class="octa-face"></div><div class="octa-face"></div>
            <div class="octa-face"></div><div class="octa-face"></div>
            <div class="octa-face"></div><div class="octa-face"></div>
        </div>

        <!-- 金字塔 -->
        <div class="pyramid pyr-1">
            <div class="pyr-face"></div><div class="pyr-face"></div>
            <div class="pyr-face"></div><div class="pyr-face"></div>
        </div>
    </div>

    <!-- 粒子拖尾 -->
    <div class="particle-trail pt-1"></div>
    <div class="particle-trail pt-2"></div>
    <div class="particle-trail pt-3"></div>

    <!-- 中心文字 -->
    <div class="center-text">
        <div class="glitch-text" data-text="SYSTEM">SYSTEM</div>
        <div class="subtitle">INITIALIZING...</div>
    </div>

    <!-- 装饰线 -->
    <div class="decoration-line"></div>

</body>
</html>
