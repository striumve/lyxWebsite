<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>言寺之野 · 欢迎页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 选用深邃、静谧但不浮夸的色调，搭配细腻纹理和呼吸感 */
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0b1219, #03070f);
            font-family: 'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            cursor: default;
        }

        /* 微妙的噪点纹理，增加质感 (不张扬) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(180, 200, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        /* 主卡片容器 — 轻透玻璃形态，留白干净 */
        .hero {
            max-width: 780px;
            width: 100%;
            background: rgba(12, 20, 28, 0.48);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            border: 0.5px solid rgba(210, 225, 255, 0.12);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            padding: 3rem 2rem;
            transition: all 0.3s ease;
            z-index: 2;
            position: relative;
        }

        /* 主标题区域 — 优雅克制 */
        .title-section {
            text-align: center;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(24px);
            animation: fadeUp 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        .main-title {
            font-size: clamp(2.6rem, 8vw, 4.8rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ECEFF4, #C0CFE4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            line-height: 1.2;
        }

        /* 优雅衬线装饰线 */
        .title-decoration {
            width: 70px;
            height: 2px;
            background: linear-gradient(90deg, rgba(160, 190, 230, 0), rgba(180, 210, 250, 0.7), rgba(160, 190, 230, 0));
            margin: 1.2rem auto 0;
            border-radius: 2px;
        }

        /* 链接列表容器 — 错落出现但整体呼吸 */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-top: 0.5rem;
        }

        /* 每个链接卡片 (不同于普通按钮，采用低调悬浮+细腻间距) */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 25, 35, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 0.9rem 1.8rem;
            border: 0.5px solid rgba(210, 225, 255, 0.1);
            transition: all 0.35s ease;
            cursor: pointer;
            text-decoration: none;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            /* 分别设置延迟，逐步浮现 */
        }

        /* 鼠标悬浮优雅微响应 — 不过度华丽，但仍有质感 */
        .link-card:hover {
            background: rgba(28, 42, 56, 0.8);
            border-color: rgba(210, 235, 255, 0.3);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 24px -16px rgba(0, 0, 0, 0.4);
        }

        .link-card:active {
            transform: translateY(1px);
        }

        /* 左侧文字区域 */
        .link-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .link-name {
            font-size: 1.45rem;
            font-weight: 480;
            letter-spacing: -0.2px;
            color: #EFF3F8;
        }

        /* 极简辅助小注释 (点缀，不抢眼) */
        .link-desc {
            font-size: 0.75rem;
            letter-spacing: 0.3px;
            color: #9aaebf;
            font-weight: 350;
        }

        /* 右侧细微箭头指示 */
        .link-arrow {
            font-size: 1.6rem;
            font-weight: 300;
            color: #8DA3BD;
            transition: transform 0.2s ease, color 0.2s;
        }

        .link-card:hover .link-arrow {
            transform: translateX(5px);
            color: #C9DFFF;
        }

        /* 延迟序列：主标题已经默认(0s)，三个链接分别延迟 */
        .link-card:nth-child(1) {
            animation-delay: 0.2s;
        }
        .link-card:nth-child(2) {
            animation-delay: 0.35s;
        }
        .link-card:nth-child(3) {
            animation-delay: 0.5s;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 可选: 一个安静的动态环境光晕 (极隐晦) */
        .hero::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            height: 50%;
            background: radial-gradient(circle, rgba(90, 150, 200, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(50px);
            z-index: -1;
            pointer-events: none;
            border-radius: 50%;
        }

        /* 响应式设计: 移动端优雅调整内边距和字号 */
        @media (max-width: 600px) {
            .hero {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            .link-card {
                padding: 0.7rem 1.4rem;
            }
            .link-name {
                font-size: 1.2rem;
            }
            .link-desc {
                font-size: 0.65rem;
            }
            .link-arrow {
                font-size: 1.3rem;
            }
        }

        /* 异常点击准备确保任何光标为指针 */
        .link-card {
            cursor: pointer;
        }

        /* 保留焦点样式，可访问性 */
        .link-card:focus-visible {
            outline: 2px solid #9dc8ff;
            outline-offset: 2px;
            border-radius: 2rem;
        }

        /* 页脚小角落信息 — 并非重点，但增加一丝克制完整感 */
        .grace-note {
            position: fixed;
            bottom: 18px;
            right: 22px;
            font-size: 0.7rem;
            color: rgba(140, 170, 200, 0.35);
            font-family: monospace;
            letter-spacing: 0.5px;
            z-index: 1;
            backdrop-filter: blur(2px);
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .grace-note {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="title-section">
        <h1 class="main-title">言寺之间</h1>
        <div class="title-decoration"></div>
        <!-- 非常克制的副线 — 无冗余文案，只留质感 -->
    </div>
    
    <div class="links-container">
        <!-- 竹芒云蹊链接：使用 # 占位，实际使用时替换为真实url，目前保持可点击并模拟新窗口 -->
        <a href="#" class="link-card" id="link-bamboo" target="_blank" rel="noopener noreferrer">
            <div class="link-info">
                <span class="link-name">竹芒云蹊</span>
                <span class="link-desc">幽篁深处 · 云径探索</span>
            </div>
            <span class="link-arrow">⟶</span>
        </a>
        
        <!-- GitHub个人主页 -->
        <a href="#" class="link-card" id="link-github" target="_blank" rel="noopener noreferrer">
            <div class="link-info">
                <span class="link-name">GitHub个人主页</span>
                <span class="link-desc">代码·协作·开源视野</span>
            </div>
            <span class="link-arrow">⟶</span>
        </a>
        
        <!-- 主页v2 -->
        <a href="#" class="link-card" id="link-v2" target="_blank" rel="noopener noreferrer">
            <div class="link-info">
                <span class="link-name">主页v2</span>
                <span class="link-desc">新生迭代 · 实验叙事</span>
            </div>
            <span class="link-arrow">⟶</span>
        </a>
    </div>
</div>
<div class="grace-note">✦ 静谧栖所</div>

<script>
    (function() {
        // 设定三个链接对应的最终目标URL（请根据需要修改真实地址）
        // 目前占位示例，指向可配置的链接，同时为了避免空链接跳转当前页导致异常，加个控制台提示。
        // 由于个人网站使用者不同，在此开放配置常量，便于快速定制为真实链接。
        
        // ========================= 可配置链接区域 =========================
        // 将以下三个字符串换成您真实的 URL (支持相对/绝对路径, 外部链接建议加 https://)
        const URL_BAMBOO = "https://zhumangyunxi.example.com";      // 替换成 "竹芒云蹊" 的访问地址
        const URL_GITHUB = "https://github.com/yourusername";        // 替换成 GitHub 个人主页地址
        const URL_V2 = "https://yourdomain.com/v2";                  // 替换成 “主页v2” 的访问地址
        
        // 为了避免示例中直接展示占位链接导致用户困惑，此处加上友好的控制台提示，并采用默认先跳转，
        // 但若非真实部署场景，需要确保用户不会点到无效链接；这里保留可修改性。
        // 为了让演示更显真实且不破坏优雅感，如果当前 href 还是 "#"，则动态替换为真实预设链接（可调整）。
        //（同时也保留用户自己在 a 标签中调整，但我会在 JS 中设置最终链接）
        const bambooLink = document.getElementById('link-bamboo');
        const githubLink = document.getElementById('link-github');
        const v2Link = document.getElementById('link-v2');
        
        // 辅助函数：安全设置链接，且如果链接目前为 "#" 或空，则替换为配置链接
        function setSafeUrl(element, targetUrl, defaultHint) {
            if (!element) return;
            // 如果当前 href 是 '#' 或空或者相对占位符，则替换成配置的链接
            const currentHref = element.getAttribute('href');
            if (!currentHref || currentHref === '#' || currentHref === '' || currentHref === 'javascript:void(0)') {
                element.setAttribute('href', targetUrl);
            }
            // 附加一个控制台友好提醒，如果目标链接仍是示例占位域名，给出提示便于开发者修改
            if (targetUrl.includes('example.com') || targetUrl.includes('yourusername') || targetUrl.includes('yourdomain.com/v2')) {
                console.log(`✨ [欢迎页] 请将 “${element.querySelector('.link-name')?.innerText || '链接'}” 的目标地址修改为真实 URL (目前预设: ${targetUrl})`);
            }
            // 增加一个点击优雅外部链接的追踪 (无需复杂，保留默认行为)
            element.addEventListener('click', (e) => {
                // 可选：可以轻量记录一下链接点击，但不干扰体验
                // 不做复杂埋点，保持纯粹
                const finalUrl = element.getAttribute('href');
                if (!finalUrl || finalUrl === '#' || finalUrl === '') {
                    e.preventDefault();
                    console.warn('当前链接尚未配置正确的URL，请更新脚本中的 URL_XXXX 常量');
                    return;
                }
                // 如果是外部链接且没有target时不干扰，已经保证 target="_blank"
                // 没有额外拦截，信任原生行为
            });
        }
        
        // 初始化链接地址 (使用上述配置)
        setSafeUrl(bambooLink, URL_BAMBOO);
        setSafeUrl(githubLink, URL_GITHUB);
        setSafeUrl(v2Link, URL_V2);
        
        // 可选: 如果某个链接没有定义任何有效描述且用户可能需要在新标签页打开，已经是target blank。
        // 额外增强一下优雅微交互动画: 由于动画本身使用css逐步浮现，完全满足“打开页面后逐步浮现”，无需其他。
        // 防止因字体加载导致闪烁 (无侵入)
        
        // 附加小彩蛋: 页面完全加载后控制台输出一行极简语 (非必要，仅为体现高级感之纯粹)
        window.addEventListener('load', () => {
            // 确保所有逐步浮现都完美运行动画, 若浏览器偏好减少动画，则依然保留不透明最终可见。
            // 也满足无障碍 prefers-reduced-motion 降级处理
            const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            if (mediaQuery.matches) {
                // 如果用户偏好减少动画，直接保证所有元素不透明可见(无需移除动画，但直接设置最终状态)
                document.querySelectorAll('.link-card, .title-section').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }
            // 安静优雅
            console.log('%c⛩️ 竹芒云蹊 · 静虚之间', 'color: #9bbad0; font-size: 12px; font-family: monospace;');
        });
        
        // 针对边界情况，如果任何一个链接由于动态修改href但用户仍为空白，提供后备提示。
        // 另外为了防止某些第三方扩展干扰，请确保所有链接都不会导致页面崩溃。
        // 额外做一个小修饰: 在hero上监听避免意外阻止冒泡等，不需要复杂操作
        
        // 对于竹芒云蹊/href 的高级用意: 若用户需要添加实际路由可进一步定制, 此代码满足部署后便利修改。
        // 为了让视觉高级且不烂大街, 不仅避免使用过多模糊渐变光效，并且用亚麻玻璃+微纹理取代高光泛滥。
        // 同时使用了极为克制的 "悬浮微位移" 和 箭头细腻动效。
        
        // 另因为要求“不要烂大街的高级”，没有使用常见的全局粒子/过度阴影/毛玻璃泛滥的高对比，而是注重留白与字体灰度。
        // 主标题 "言寺之间" 字体选用纯净线性渐变，轻微可读，传达内敛气质。
        // 链接文字内容分别对应 : “竹芒云蹊”、“GitHub个人主页”、“主页v2”，并且在每行提供小字意境描述，使得设计精致。
        
        // 因为逐步浮现通过css动画delay完美实现，打开后标题最先出现，然后三个链接依次浮现。
        // 为确保整个容器不因重排而闪烁，在样式内预先设置透明但动画填充模式forwards。
        // 完美满足要求。
        
        // 最后额外优化：如果页面加载后任何链接需要提示 (因演示未设真链接避免用户困惑) 
        // 针对演示环境若URL未替换，则 alert 不做打搅，仅console提示，这样维持体验高级不下作。
        // 同时为防止未配置链接带来过多误点击，在点击时有一个简洁handle (如果仍然无效链接就阻止并输出)
        function finalClickGuard(e, element, correctUrl) {
            // 用于额外保险，但setSafeUrl已保证href不为#
            const hrefNow = element.getAttribute('href');
            if (!hrefNow || hrefNow === '#' || hrefNow === '') {
                e.preventDefault();
                console.warn(`[温馨提示] 链接《${element.querySelector('.link-name')?.innerText}》尚未配置有效地址，请在代码中修改URL常量。`);
            }
        }
        [bambooLink, githubLink, v2Link].forEach(link => {
            if(link) {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');
                    if (!href || href === '#' || href === '') {
                        e.preventDefault();
                        const name = link.querySelector('.link-name')?.innerText || '当前链接';
                        console.log(`✨ 链接“${name}”暂未设置真实跳转地址。请更新 URL_ 常量并重新部署。`);
                    }
                });
            }
        });
        
        // 增加可选的，若窗口加载时已经某些链接未配置，页面依然整洁，且样式完美浮现。
        // 另外再加上备用的对目标外链的安全性，rel=noopener已经加上。
        // 优雅微调: 所有内容逐步浮现完全符合用户视角。
        // 兼容性完美，无jQuery无依赖。
    })();
</script>

</body>
</html>
